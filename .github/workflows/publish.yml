name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Require a matching version tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Run this workflow from tag v${package_version}; current ref is ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run release gate
        run: npm test
      - name: Publish framework with provenance
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "@boobstrap/boobstrap@${package_version}" version >/dev/null 2>&1; then
            echo "@boobstrap/boobstrap@${package_version} is already published; skipping."
          else
            npm publish --access public --provenance --tag "${{ inputs.npm_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish Alpine adapter with provenance
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/alpine/package.json').version")"
          if npm view "@boobstrap/alpine@${package_version}" version >/dev/null 2>&1; then
            echo "@boobstrap/alpine@${package_version} is already published; skipping."
          else
            npm publish --workspace @boobstrap/alpine --access public --provenance --tag "${{ inputs.npm_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish React adapter with provenance
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/react/package.json').version")"
          if npm view "@boobstrap/react@${package_version}" version >/dev/null 2>&1; then
            echo "@boobstrap/react@${package_version} is already published; skipping."
          else
            npm publish --workspace @boobstrap/react --access public --provenance --tag "${{ inputs.npm_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
