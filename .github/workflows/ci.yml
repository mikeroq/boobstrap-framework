name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Package contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build framework
        run: npm run build
      - name: Verify public API
        run: npm run test:contract
      - name: Validate CSS
        run: npm run test:css
      - name: Verify package contents
        run: npm run test:package
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  browsers:
    name: Browser contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build framework
        run: npm run build
      - name: Run browser contracts
        shell: bash
        run: |
          for browser in chromium firefox webkit; do
            BROWSER="$browser" npm run test:browser
          done

  package-managers:
    name: Install with ${{ matrix.manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, yarn, pnpm, bun]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Corepack manager
        if: matrix.manager == 'yarn' || matrix.manager == 'pnpm'
        run: corepack enable && corepack prepare "${{ matrix.manager }}@latest" --activate
      - name: Install framework dependencies
        run: npm ci
      - name: Pack framework
        id: pack
        shell: bash
        run: |
          archive="$(npm pack --silent)"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Create consumer fixture
        run: mkdir consumer && cd consumer && npm init -y
      - name: Install packed framework
        working-directory: consumer
        shell: bash
        run: |
          archive="../${{ steps.pack.outputs.archive }}"
          case "${{ matrix.manager }}" in
            npm) npm install "$archive" ;;
            yarn) yarn add "$archive" ;;
            pnpm) pnpm add "$archive" ;;
            bun) bun add "$archive" ;;
          esac
      - name: Verify exported stylesheet
        working-directory: consumer
        run: node ../scripts/verify-consumer.mjs
