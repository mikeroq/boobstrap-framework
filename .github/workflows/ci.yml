name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Package contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build framework
        run: npm run build
      - name: Verify public API
        run: npm run test:contract
      - name: Validate CSS
        run: npm run test:css
      - name: Verify distribution size budgets
        run: npm run test:size
      - name: Verify package contents
        run: npm run test:package
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  browsers:
    name: Browser contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build framework
        run: npm run build
      - name: Run browser contracts
        shell: bash
        run: |
          for browser in chromium firefox webkit; do
            BROWSER="$browser" npm run test:browser
          done

  visual:
    name: Visual regression (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [dark-components, dark-content, light-components, light-content, variants]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build framework
        run: npm run build
      - name: Run visual regression contract
        run: npm run test:visual
        env:
          VISUAL_GROUP: ${{ matrix.group }}
      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diagnostics-${{ matrix.group }}
          path: artifacts/visual/
          if-no-files-found: ignore

  package-managers:
    name: Install with ${{ matrix.manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, yarn, pnpm, bun]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Corepack manager
        if: matrix.manager == 'yarn' || matrix.manager == 'pnpm'
        run: corepack enable && corepack prepare "${{ matrix.manager }}@latest" --activate
      - name: Install framework dependencies
        run: npm ci
      - name: Pack framework
        id: pack
        shell: bash
        run: |
          npm pack --silent >/dev/null
          npm pack --silent --workspace @boobstrap/alpine >/dev/null
          npm pack --silent --workspace @boobstrap/react >/dev/null
          npm pack --silent --workspace @boobstrap/vue >/dev/null
          core_version="$(node -p "require('./package.json').version")"
          alpine_version="$(node -p "require('./packages/alpine/package.json').version")"
          react_version="$(node -p "require('./packages/react/package.json').version")"
          vue_version="$(node -p "require('./packages/vue/package.json').version")"
          core_archive="boobstrap-boobstrap-${core_version}.tgz"
          alpine_archive="boobstrap-alpine-${alpine_version}.tgz"
          react_archive="boobstrap-react-${react_version}.tgz"
          vue_archive="boobstrap-vue-${vue_version}.tgz"
          echo "core_archive=${core_archive}" >> "$GITHUB_OUTPUT"
          echo "alpine_archive=${alpine_archive}" >> "$GITHUB_OUTPUT"
          echo "react_archive=${react_archive}" >> "$GITHUB_OUTPUT"
          echo "vue_archive=${vue_archive}" >> "$GITHUB_OUTPUT"
      - name: Create consumer fixture
        run: mkdir consumer && cd consumer && npm init -y && touch yarn.lock
      - name: Install packed framework
        working-directory: consumer
        shell: bash
        run: |
          core_archive="../${{ steps.pack.outputs.core_archive }}"
          alpine_archive="../${{ steps.pack.outputs.alpine_archive }}"
          react_archive="../${{ steps.pack.outputs.react_archive }}"
          vue_archive="../${{ steps.pack.outputs.vue_archive }}"
          case "${{ matrix.manager }}" in
            npm) npm install "$core_archive" "$alpine_archive" "$react_archive" "$vue_archive" alpinejs@3.15.12 react@19.2.8 vue@3.5.0 ;;
            yarn) yarn add "$core_archive" "$alpine_archive" "$react_archive" "$vue_archive" alpinejs@3.15.12 react@19.2.8 vue@3.5.0 ;;
            pnpm) pnpm add "$core_archive" "$alpine_archive" "$react_archive" "$vue_archive" alpinejs@3.15.12 react@19.2.8 vue@3.5.0 ;;
            bun) bun add "$core_archive" "$alpine_archive" "$react_archive" "$vue_archive" alpinejs@3.15.12 react@19.2.8 vue@3.5.0 ;;
          esac
      - name: Verify exported stylesheet
        working-directory: consumer
        shell: bash
        run: |
          if [[ "${{ matrix.manager }}" == "yarn" ]]; then
            yarn node ../scripts/verify-consumer.mjs
          else
            node ../scripts/verify-consumer.mjs
          fi
