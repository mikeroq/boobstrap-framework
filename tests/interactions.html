<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/dist/boobstrap.css" />
    <title>Boobstrap interaction contract</title>
    <style>
      main { display: grid; gap: 2rem; max-width: 42rem; margin-inline: auto; padding: 2rem; }
    </style>
  </head>
  <body>
    <div class="bs-banner bs-banner-warning" id="framework-banner" role="status" data-bs-banner>
      <div class="bs-banner-inner">
        <svg class="bs-banner-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20L12 3Z"></path><path d="M12 9v5M12 18h.01"></path></svg>
        <div class="bs-banner-content">
          <strong class="bs-banner-title">Development environment</strong>
          <span class="bs-banner-message">Changes here may be incomplete.</span>
        </div>
        <a class="bs-banner-action" href="#live">View live site</a>
        <button class="bs-banner-dismiss" type="button" data-bs-banner-dismiss aria-label="Dismiss development banner">×</button>
      </div>
    </div>
    <main>
      <section aria-label="Loading button example">
        <button
          class="bs-btn bs-btn-primary"
          id="loading-button"
          type="button"
          data-bs-button
          data-bs-loading
          data-bs-loading-label="Saving changes"
        >
          <span class="bs-btn-label">Save changes</span>
          <span class="bs-spinner bs-btn-spinner" aria-hidden="true"></span>
        </button>
      </section>

      <section aria-labelledby="collapse-heading">
        <h1 id="collapse-heading">Interaction contract</h1>
        <button
          class="bs-btn bs-btn-secondary"
          id="collapse-toggle"
          type="button"
          data-bs-toggle="collapse"
          aria-controls="collapse-panel"
        >Toggle details</button>
        <div class="bs-collapse bs-card bs-mt-4" id="collapse-panel" hidden>
          <div class="bs-card-body">Collapsible details</div>
        </div>
      </section>

      <section aria-label="Dropdown example">
        <div class="bs-dropdown" data-bs-dropdown>
          <button class="bs-btn bs-btn-secondary" id="actions-toggle" type="button" data-bs-toggle="dropdown" aria-controls="actions-menu">
            Actions
          </button>
          <div class="bs-dropdown-menu" id="actions-menu" role="menu" aria-labelledby="actions-toggle" data-bs-dropdown-menu hidden>
            <button class="bs-dropdown-item" type="button" role="menuitem">Edit</button>
            <button class="bs-dropdown-item" type="button" role="menuitem" disabled>Archive</button>
            <button class="bs-dropdown-item" type="button" role="menuitem">Duplicate</button>
          </div>
        </div>
      </section>

      <section aria-label="Split dropdown example">
        <div class="bs-dropdown bs-btn-group" data-bs-dropdown>
          <button class="bs-btn bs-btn-primary" type="button">Create</button>
          <button class="bs-btn bs-btn-primary bs-btn-split bs-btn-caret" id="create-toggle" type="button" data-bs-toggle="dropdown" aria-controls="create-menu" aria-label="More create options"></button>
          <div class="bs-dropdown-menu bs-dropdown-menu-end" id="create-menu" role="menu" aria-labelledby="create-toggle" data-bs-dropdown-menu hidden>
            <button class="bs-dropdown-item" type="button" role="menuitem">Create draft</button>
          </div>
        </div>
      </section>

      <section aria-labelledby="account-tabs-label">
        <h2 id="account-tabs-label">Account</h2>
        <div class="bs-tabs" role="tablist" aria-labelledby="account-tabs-label" data-bs-tabs>
          <button class="bs-tab" id="profile-tab" type="button" role="tab" aria-controls="profile-panel" aria-selected="true">Profile</button>
          <button class="bs-tab" id="billing-tab" type="button" role="tab" aria-controls="billing-panel" aria-disabled="true">Billing</button>
          <button class="bs-tab" id="security-tab" type="button" role="tab" aria-controls="security-panel">Security</button>
        </div>
        <div class="bs-tab-panel" id="profile-panel" role="tabpanel" aria-labelledby="profile-tab">Profile settings</div>
        <div class="bs-tab-panel" id="billing-panel" role="tabpanel" aria-labelledby="billing-tab" hidden>Billing settings</div>
        <div class="bs-tab-panel" id="security-panel" role="tabpanel" aria-labelledby="security-tab" hidden>Security settings</div>
      </section>

      <section aria-labelledby="combobox-label">
        <label class="bs-label" id="combobox-label" for="framework-combobox-input">Role</label>
        <div class="bs-combobox" data-bs-combobox>
          <input class="bs-combobox-input" id="framework-combobox-input" data-bs-combobox-input placeholder="Search roles" />
          <button class="bs-combobox-toggle" type="button" data-bs-combobox-toggle aria-label="Toggle roles"></button>
          <input type="hidden" name="role" data-bs-combobox-value />
          <div class="bs-combobox-listbox" data-bs-combobox-listbox hidden>
            <div class="bs-combobox-option" data-bs-combobox-option data-bs-value="designer">Designer</div>
            <div class="bs-combobox-option" data-bs-combobox-option data-bs-value="engineer">Engineer</div>
            <div class="bs-combobox-option" data-bs-combobox-option data-bs-value="founder" aria-disabled="true">Founder</div>
            <div class="bs-combobox-empty" data-bs-combobox-empty hidden>No roles found</div>
          </div>
        </div>
      </section>

      <section class="bs-form-group" data-bs-password>
        <label class="bs-label" for="framework-password">Password</label>
        <div class="bs-input-wrap">
          <input class="bs-input bs-input-has-icon-end" id="framework-password" type="password" data-bs-password-input />
          <button class="bs-input-action" type="button" data-bs-password-toggle><span data-bs-password-label>Show password</span></button>
        </div>
      </section>

      <section class="bs-form-group">
        <label class="bs-label" for="framework-phone">Phone</label>
        <input class="bs-input" id="framework-phone" type="tel" data-bs-mask="(999) 999-9999" />
      </section>

      <section class="bs-form-group">
        <span class="bs-label" id="otp-label">Verification code</span>
        <div class="bs-otp" data-bs-otp aria-labelledby="otp-label">
          <input class="bs-otp-input" aria-label="Digit 1" data-bs-otp-input />
          <input class="bs-otp-input" aria-label="Digit 2" data-bs-otp-input />
          <input class="bs-otp-input" aria-label="Digit 3" data-bs-otp-input />
          <input class="bs-otp-input" aria-label="Digit 4" data-bs-otp-input />
          <input class="bs-otp-input" aria-label="Digit 5" data-bs-otp-input />
          <input class="bs-otp-input" aria-label="Digit 6" data-bs-otp-input />
          <input type="hidden" name="verification_code" data-bs-otp-value />
        </div>
      </section>
    </main>

    <script type="module">
      import { initBoobstrap } from "/dist/boobstrap.js";

      window.bsEvents = [];
      for (const name of ["bs:banner:dismissed", "bs:banner:shown", "bs:button:started", "bs:button:stopped", "bs:collapse:shown", "bs:collapse:hidden", "bs:combobox:shown", "bs:combobox:change", "bs:combobox:hidden", "bs:dropdown:shown", "bs:dropdown:hidden", "bs:mask:change", "bs:otp:complete", "bs:password:toggled", "bs:tabs:changed"]) {
        document.addEventListener(name, () => window.bsEvents.push(name));
      }
      window.bs = initBoobstrap();
    </script>
  </body>
</html>
